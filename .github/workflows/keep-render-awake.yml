name: Keep Medora demo awake

on:
  schedule:
    # Five runs per hour keep the planned gap at or below 14 minutes.
    - cron: "5,19,33,47,59 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PING_URL: ${{ vars.MEDORA_PING_URL || 'https://assignment2-gold-one.vercel.app/api/health' }}
    steps:
      - name: Wake the Render backend through Vercel
        run: |
          curl --fail --silent --show-error --retry 1 --retry-delay 5 --retry-all-errors --max-time 120 \
            --header 'Cache-Control: no-store' "$PING_URL"
